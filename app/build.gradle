plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'io.github.s24u.popupscale'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.s24u.popupscale'
        minSdk 28
        targetSdk 35
        versionCode 186
        versionName '0.6.79'
        testInstrumentationRunner 'io.github.s24u.popupscale.SettingsDefaultsInstrumentation'
    }
    signingConfigs {
        debug {
            def localKeystore = rootProject.file('.local/signing/debug.keystore')
            if (localKeystore.exists()) {
                storeFile localKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            def storePath = System.getenv('RELEASE_STORE_FILE')
            if (storePath && file(storePath).exists()) {
                storeFile file(storePath)
                storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: ''
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: ''
            } else {
                initWith debug
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    // Compile-time stubs only. LSPosed supplies the runtime implementation.
    compileOnly files('libs/xposed-api-82.jar')
    implementation 'com.google.android.material:material:1.12.0'
}
tasks.register('verifyGesturePolicy', JavaExec) {
    dependsOn 'compileDebugUnitTestKotlin'
    classpath = files('build/tmp/kotlin-classes/debugUnitTest', 'build/tmp/kotlin-classes/debug') + files(android.bootClasspath) +
            configurations.debugUnitTestRuntimeClasspath.filter { it.name.endsWith('.jar') }
    mainClass = 'io.github.s24u.popupscale.gestures.GesturePolicyChecks'
}

// Every version bump must carry matching user-facing notes, independent of developer CHANGELOG.md.
tasks.register('verifyReleaseNotes') {
    inputs.file('src/main/res/raw/release_notes.json')
    inputs.property('moduleVersion', android.defaultConfig.versionName)
    doLast {
        def notes = new groovy.json.JsonSlurper().parse(file('src/main/res/raw/release_notes.json'), 'UTF-8')
        if (!(notes instanceof List) || notes.isEmpty() || notes[0].version != android.defaultConfig.versionName ||
                notes.any { !it.version || !it.date || !(it.changes instanceof List) || it.changes.isEmpty() } ||
                notes.collect { it.version }.unique().size() != notes.size()) {
            throw new GradleException('release_notes.json must contain unique releases and start with the current version.')
        }
    }
}
tasks.named('preBuild') { dependsOn 'verifyReleaseNotes' }
